name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      # dist はコミットして配布するので、src だけ直して作り直し忘れたコミットを落とす
      - name: dist が src から作り直されているか確認する
        run: |
          npm run build
          git diff --exit-code -- dist

name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN で作ったリリース PR では CI が起動せず、main で必須の test が揃わないので App のトークンを使う
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # release-please がブランチ・PR・ラベルを作るのに要る分だけに絞る
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      # 書き込みのトークンを渡すサードパーティのアクションなので、タグの付け替えで中身が変わらないよう SHA で固定する
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      # 以降はリリース PR がマージされて Release が作られたときだけ動く。
      # README のインストール URL は最新の Release の添付ファイルを指すので、作った Release に dist を添付する
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}
      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
      - if: ${{ steps.release.outputs.release_created }}
        run: npm test
      - if: ${{ steps.release.outputs.release_created }}
        run: npm run build
      # Violentmonkey は @version が上がったときだけ更新するので、タグと食い違うものを添付しない
      - name: タグと @version が一致するか確認する
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          version=$(sed -n 's|^// @version *||p' dist/youtube-comment-filter.user.js)
          if [ "v${version}" != "${TAG_NAME}" ]; then
            echo "tag ${TAG_NAME} does not match @version ${version}" >&2
            exit 1
          fi
      - name: Release に dist を添付する
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "${TAG_NAME}" dist/youtube-comment-filter.user.js

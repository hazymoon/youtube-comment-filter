name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - name: dist が src から作り直されているか確認する
        run: |
          npm run build
          git diff --exit-code -- dist
      # Violentmonkey は @version が上がったときだけ更新するので、タグと食い違うリリースを出さない
      - name: タグと @version が一致するか確認する
        run: |
          version=$(sed -n 's|^// @version *||p' dist/youtube-comment-filter.user.js)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match @version ${version}" >&2
            exit 1
          fi
      - name: Release を作成する
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/youtube-comment-filter.user.js --generate-notes
